# Demonstration setup (Phase 4 human decisions, reports/multi_phase4_realtime.md).
# An OVERLAY: run_demo.py --overlay configs/fast.yaml merges it over
# configs/base.yaml key by key; anything not named here keeps its base value.
#
#   NPU lane (port 8080): Llama 3.2 3B -> water and heat diagnosticians
#   CPU lane (port 8081): Gemma 3 1B   -> verifier and text reader, in the
#                                         background (real-time mode)
agent:
  verifier: conditional             # only uncertain answers at INVESTIGATE or above
multi:
  placement: fixed
  fixed_placement:
    diagnostician: npu
    diag_water: npu
    diag_heat: npu                  # HUMAN DECISION 2: heat side on the NPU, not the CPU
    verifier: cpu
    text_reader: cpu
    query: cpu
  lanes:                            # HUMAN DECISION 3: one model per lane
    npu: {model_file: Llama-3.2-3B-Instruct-Q4_0-pure-embq8.gguf}
    cpu: {model_file: gemma-3-1b-it-qat-Q4_0-pure-embq8.gguf}
  compact:
    schema: true
    rules: true
    cases: true
    notes: true
    world: true
    ver_schema: true
    ver_rules: true
    ver_claims: true
    # HUMAN DECISION 2026-10-07: no "[group X]" on case lines and no leading "g"
    # in the diagnosis answer (the model picked the most common letter in 89% of
    # answers; reports/multi_llm_impact_design.md). Runs made with this are not
    # comparable with earlier fast.yaml runs on diagnosis answers.
    group_letters: false
  split: true
  split_on_change: true
  # HUMAN DECISION 2026-10-05 ("fix the json replies, enforce the strict limits
  # on the server"): after the first board runs, where Gemma 1B's verifier and
  # text-reader answers were almost all unusable (code fences, cut off at the
  # cap) and a quarter of Llama 3B's diagnoses were not JSON. Runs made with
  # this on are not comparable on format failures with runs made before it.
  grammar: true
