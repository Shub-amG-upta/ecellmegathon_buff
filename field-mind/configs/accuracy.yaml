# Accuracy runs of the multi-agent accuracy-fix work (reports/multi_accuracy_fix.md).
# An OVERLAY on configs/base.yaml: configs/fast.yaml's settings, with ONE model on
# both lanes. HUMAN DECISION 4: the two-model setup (Llama 3B NPU, Gemma 1B CPU)
# is a deliberate change to the plan for the demonstration; accuracy runs use
# Llama 3.2 3B only (same GGUF on both lanes, plan rule 3).
#   OVERLAY=configs/accuracy.yaml CPU_MODEL=Llama-3.2-3B-Instruct-Q4_0-pure-embq8.gguf \
#   EPISODES_DIR=data/episodes_dev scripts/benchmark_multi_lockstep_all.sh <dev episodes>
agent:
  verifier: conditional
multi:
  placement: fixed
  fixed_placement:
    diagnostician: npu
    diag_water: npu
    diag_heat: npu
    verifier: cpu
    text_reader: cpu
    query: cpu
  lanes:
    npu: {model_file: Llama-3.2-3B-Instruct-Q4_0-pure-embq8.gguf}
    cpu: {model_file: Llama-3.2-3B-Instruct-Q4_0-pure-embq8.gguf}
  compact:
    schema: true
    rules: true
    cases: true
    notes: true
    world: true
    ver_schema: true
    ver_rules: true
    ver_claims: true
  split: true
  split_on_change: true
  merge_rule: tiebreak             # accuracy-fix decision 1 (primary); baseline 3 runs with --merge-rule model
  grammar: true
