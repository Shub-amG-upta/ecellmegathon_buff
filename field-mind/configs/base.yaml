# ===========================================================================
#  FieldMind Boiler Agent -- base configuration
# ===========================================================================
#  Every decision variable from Plan §11.2 is here and nowhere else. The
#  sweep (bench/sweep.py) works by overriding keys in this file, so anything
#  hard-coded elsewhere is a bug that will silently limit the search space.
# ===========================================================================

# ---------------------------------------------------------------------------
#  THE MODEL SWITCH.  This is the only line you change to move between
#  cloud development and on-device measurement.
#
#     mock    no network, no key, deterministic. Plumbing tests only --
#             never report a mock run as an agent result.
#     gemini  Google AI Studio. Valid for QUALITY metrics (Q1-Q7) while the
#             device path is being built. Meaningless for SYSTEM metrics.
#     litert  LiteRT-LM on the QIDK. The numbers that go in the writeup.
# ---------------------------------------------------------------------------
llm:
  # Phase 0a: defaults to mock so the board is only used when --backend is
  # passed explicitly (or this line is changed on purpose).
  backend: mock

  gemini:
    # gemini-2.0-flash was decommissioned (HTTP 404 "no longer available",
    # observed 2026-09-02) -- every call in the old runs_gemini.json errored and
    # the pipeline silently fell back to the deterministic ranking. Switched to
    # the lite alias, which is fast and non-"thinking" (no thoughtsTokenCount
    # eating the maxOutputTokens budget, unlike gemini-3.6-flash).
    model: gemini-flash-lite-latest
    api_key_env: GOOGLE_API_KEY     # export it; never put the key in this file
    temperature: 0.1
    timeout_s: 30
    json_mode: true                 # cloud stand-in for grammar-constrained decoding
    max_retries: 5                  # 429 / 5xx / network drop: exp backoff + jitter
    backoff_base_s: 2.0
    backoff_cap_s: 60.0
    min_interval_s: 4.0             # proactive spacing for the ~15 RPM free tier

  litert:
    mode: adb                       # adb (host drives board) | local (agent on board)
    device_dir: /data/local/tmp/llm
    binary: litert_lm_main
    # VERIFIED on device 2026-09-03: the sm8650-tagged model is NOT on the
    # board. What is there is model.litertlm (584 MB, generic, CPU/GPU).
    model_file: model.litertlm
    # cpu | gpu | npu  <- decision variable b_s.
    # On this board only CPU registers: no libQnnHtp* (NPU) and no
    # libLiteRtClGl/Vulkan accelerator (GPU). Both fail with a WARNING and then
    # run on CPU, so setting either here yields mislabelled CPU numbers.
    accelerator: cpu
    timeout_s: 60
    adb_serial: ""                  # set if more than one device is attached

  # Phase 0b: persistent llama-server lanes on the QIDK (started by /board-up),
  # reached through `adb forward`. NPU lane :8080 (--device HTP0 -ngl 99),
  # CPU lane :8081 (-ngl 0). Same GGUF on both; Q4_0 or Q8_0 only.
  llamaserver:
    url: http://localhost:8080      # --url on run_demo.py overrides (CPU lane: :8081)
    lane: npu                       # label written to LLMReply.backend
    model_file: null                # set after the Phase 0b model choice (human decision)
    # DERIVED: largest context_cap_tokens (3072) + agent.max_tokens (256) = 3328,
    # rounded up to the next power of two. Used by /board-up for -c on both lanes.
    ctx_size: 4096
    cpu_threads: 6                  # CPU lane -t; /board-up starting value, recorded
    temperature: 0.0                # design choice: greedy, so runs reproduce
    seed: 0
    timeout_s: 120                  # 256-token cap at ~12 tok/s decode is ~21 s; margin for prefill
    json_mode: false                # no grammar: broken-JSON rate measures the model
    cache_prompt: false             # every prompt token prefilled and counted

# ---------------------------------------------------------------------------
#  Agent behaviour
# ---------------------------------------------------------------------------
agent:
  tick_period_s: 30                 # decision variable T: {15, 30, 60}
  policy: sequential                # decision variable pi: sequential|pipelined|conditional
  verifier: conditional             # decision variable v: always|conditional|never
  verifier_band: [0.35, 0.75]       # conditional mode fires inside this band
  # Answer cap. Phase 0a: set to 256 by the user (provenance: user decision, not
  # derived). The multi-agent plan's per-agent targets are 60/30/50/120; this
  # is the interim single-agent value. Read by Diagnostician and Verifier.
  max_tokens: 256
  max_actions: 3
  min_faithfulness: 0.5             # below this the model's ranking is discarded
  hard_stage_deadline_ms: 200       # constraint C1 -- miss rate must be zero
  llm_budget_ms: 8000

  triage:
    trip_horizon_min: 5.0

  belief:
    # Retire a hypothesis no retrieved case has carried for this many
    # consecutive ticks (an Event is logged for each). DERIVED: the
    # signature is built from the raw 10-minute least-squares slope
    # (orchestrator._slopes), and 10 min / tick_period_s 30 = 20 ticks, so
    # after 20 ticks none of the evidence that retrieved the case is still in
    # the signature. ASSUMED range [10, 120] ticks: 10 = the 5-min balance
    # window (5 min / 30 s), 120 = the 60-min sensor window (60 min / 30 s). It sets how long a stale
    # look-alike (e.g. RCA-09 / RCA-10 / RCA-15) can stay ranked after it stops
    # being retrieved. Not tuned on the 30 reporting episodes.
    # `null` switches retirement OFF (hypotheses are then only retired by the
    # confidence floor). DEFAULT OFF: Phase 0a measured it on and off at A2 and
    # it failed the keep rule (library tie-fair belief top-1 -0.025, belief
    # group -0.024); see reports/phase0a_single_agent_fixes.md. Set to 20 to
    # turn it on.
    retire_after_ticks: null

  retrieval:                        # decision variable k
    k_cases: 4
    k_notes: 5
    k_experience: 2
    k_records: 5
    topology_depth: 3
    context_cap_tokens:             # decision variable L, per triage level
      WATCH: 2048
      INVESTIGATE: 3072
      URGENT: 1024

# ---------------------------------------------------------------------------
#  Multi-agent (fieldmind/multi, run_demo.py --arch multi). Read ONLY by the
#  multi path; the single agent never sees this block.
# ---------------------------------------------------------------------------
multi:
  mode: lockstep                    # lockstep only in Phase 1; realtime is Session 6
  # Lane choice: fixed | earliest_finish (run_demo.py --placement overrides).
  # HUMAN DECISION (Phase 1 close-out, Phase 2 plan review): the default is
  # `fixed`, because real-model accuracy gates need one cause per change and
  # NPU and CPU numerics can answer the same prompt differently. Earliest
  # finish (plan p.10) and the other study policies return in Phase 5.
  placement: fixed
  # CITED: plan "Model agents" default lanes (p.5) and "Policies to compare",
  # fixed placement (p.11): water diagnostician NPU, heat CPU, verifier CPU;
  # text reader and query agent CPU. `diagnostician` (the unsplit Phase 2
  # diagnostician) -> npu is a HUMAN DECISION (Phase 2 plan review); the
  # plan's table names only the two halves.
  fixed_placement:
    diagnostician: npu
    diag_water: npu
    diag_heat: cpu
    verifier: cpu
    text_reader: cpu
    query: cpu
  adapt_rates: false                # rate update from measured timings: not built (Phase 1)
  # Single-writer audit: fingerprint every blackboard section around each agent
  # step and raise if a non-owner changed one. Costs hard-path time (measured
  # in reports/multi_phase1_plumbing.md); the API-level check is always on.
  audit_writes: true
  # Deadlines per priority, seconds after the evidence tick. CITED: plan
  # "Priorities and deadlines" (p.10): P1 10 s, P2 30 s, P3 60 s, P4 none.
  # P0 is the hard path, agent.hard_stage_deadline_ms (200 ms).
  deadlines_s: {P1: 10, P2: 30, P3: 60, P4: null}
  # Lanes, in tie-break order. Rates CITED: plan "Rates used for planning"
  # (p.14-15): NPU llama.cpp, Llama 3.2 3B Q4_0, ~1150-token prompt, prefill
  # ~909 / decode ~13.9 tok/s; CPU, Gemma 3 1B on LiteRT-LM, ~126 / ~42.
  # ASSUMED as this project's lane rates: two DIFFERENT models, not the one GGUF
  # both lanes will run; range unknown until Session 2 measures the chosen
  # model on both lanes (then replace). Affects: lane choice and the simulated
  # clock (queue wait, sim finish) only -- never a mock decision, since both
  # lanes call the same backend.
  lanes:
    npu: {prefill_tok_s: 909, decode_tok_s: 13.9, url: "http://localhost:8080"}
    cpu: {prefill_tok_s: 126, decode_tok_s: 42, url: "http://localhost:8081"}
  # ---- Phase 2: shrunk prompts and short answers. Every switch off = the
  # Phase 1 path (the single agent's prompts, byte for byte).
  compact:
    text_reader: true               # notes -> note-facts (one model call per note)
    # Compact diagnostician (commit 5). DESIGN: all off = the single agent's
    # prompt byte for byte; `schema` = answer format B' (amendment 1) with
    # numbered lines, at most 9 fact lines, no candidate causes, cap 60; the
    # other four shrink one section each and need `schema`. Off by default in
    # commit 5; run_demo.py --compact all|none|schema,rules,... per run.
    schema: false
    rules: false
    cases: false
    notes: false                    # note-facts (max 4) + record-facts (max 4)
    world: false
    case_order: score               # score | shuffled (seeded by the evidence tick)
    # "[group X]" on compact case lines and the answer's leading "g" (Phase 2).
    # Off in configs/fast.yaml (2026-10-07). On = every earlier prompt unchanged.
    group_letters: true
    # Compact verifier (commit 6). All off = the single agent's verifier.
    # `ver_schema` = pass/fail per shown claim by line number (amendment 1
    # item 3), top 3 claims, no confidence or discriminator (decision (b)),
    # cap 30; `ver_rules` short rules; `ver_claims` first sentence of the cause.
    ver_schema: false
    ver_rules: false
    ver_claims: false
  # Phase 3: split the diagnostician by plant side (diag_water on the NPU,
  # diag_heat on the CPU, multi.fixed_placement). Needs compact.schema on.
  # DESIGN (reports/multi_phase3_split.md); off = Phase 2 exactly.
  split: false
  # Phase 3 commit 3: call a side's diagnostician only when its evidence
  # (side signature, open findings with severity, note-facts) changed; re-use
  # the side's last checked answer otherwise. Needs split. Off = commit 2.
  split_on_change: false
  # Accuracy-fix work (reports/multi_accuracy_fix.md, decision 1 + amendment):
  # how a checked model answer reaches the published ranking.
  #   model        the single agent's merge, model order wins (Phases 1-4)
  #   belief_only  belief's top 3, model answers logged and ignored
  #   tiebreak     belief's order; the model reorders only cases within 0.35
  #                log-odds of belief's leader, every tick (PRIMARY)
  #   nudge        belief log-odds + capped model offsets, +0.35 / +0.175,
  #                at most 1.2 per case per episode (SECONDARY arm)
  #   hybrid       belief weak (best log-odds < 0) or tied (margin < 0.35): the
  #                model's ranking of belief's non-flat cases first; else nudge
  #                (flat cases never nudged). Proposed 2026-10-08, dev-validated only
  # Needs multi.split. Default = model (earlier behaviour exactly).
  merge_rule: model
  # Answer grammars (fieldmind/multi/grammar.py): every model job sends a GBNF
  # with its request and llama-server samples only what it allows -- the compact
  # answer format, line numbers the prompt showed, the note vocabulary, and a
  # longest answer under the job's cap. Needs compact.schema (and ver_schema
  # for the verifier). With it the wrong-format rate is zero BY CONSTRUCTION
  # and no longer measures the model. Off = the earlier behaviour exactly; on
  # in configs/fast.yaml (HUMAN DECISION 2026-10-05).
  grammar: false
  # Look-alike groups -> the group letters in compact case lines (bench/case_groups.py).
  case_groups: data/kb/case_groups.json
  # Guard: estimated prompt tokens = ceil(chars / this). FITTED (commit 5
  # report): the lowest chars per TEMPLATED prompt token of any dev all-on
  # diagnostician prompt over the four tokenizers (Qwen2.5 0.5B, 2.9105),
  # rounded down to 0.01. Dev only. Affects: only whether the guard drops
  # lines (dev maximum estimate 1,021 + 60 < 1,280). null = guard off.
  compact_guard_cpt: 2.91
  # Answer caps, tokens. CITED: plan "Model agents" (p.5) and CLAUDE.md.
  answer_caps: {diagnostician: 60, verifier: 30, text_reader: 50, query: 120}
  # The text reader's vocabulary. DESIGN CHOICE (not derived): the kinds, the
  # states and the three extra subjects were written from the 20 distinct note
  # texts of the DEV set (reports/multi_phase2_prompt_shrink.md, note-fact
  # coverage). Subjects also include the six tags and the asset model's
  # equipment ids. Not tuned on the reporting episodes. max_pairs 3 keeps the
  # worst-case answer at 36-40 tokens on the four candidate tokenizers.
  text_reader:
    kinds: [OBS, MAINT, INSTR, OTHER]
    states: [UP, DOWN, HIGH, LOW, NORMAL, STUCK, OPEN, CHOKED, WET, LEAK,
             NO_LEAK, SERVICED, UNCHECKED, TRIPPED, MENTIONED]
    extra_subjects: [MAKEUP_WATER, COAL, COAL_CV, EFFICIENCY]
    max_pairs: 3

# ---------------------------------------------------------------------------
#  Deterministic check thresholds  (Plan Appendix A.5)
#  RE-TUNED IN STAGE 4 against the regenerated episodes: sub-model-4 dropped
#  bed/ms emit noise ~20x but added an OU load driver + independent per-
#  subsystem process disturbances, so the no-fault slope/residual
#  distributions moved. Every threshold below is now set from the p99.7 of the
#  matching statistic over 12 FRESH-seeded no-fault runs (seeds 900-911, kept
#  disjoint from N01-N06 so Q5 stays uncircular). Aggregate analytic FP rate
#  1.5 ticks/hour (report: reports/stage4_regeneration.md).
# ---------------------------------------------------------------------------
checks:
  sample_period_s: 5.0
  # How much bed temperature moves per TPH of load; the component
  # _load_normalised_bed_slope removes before flagging a drift, and the
  # reference the DEVIATION band uses (bed_ref = 850 + coef*(steam-67)).
  # Stage-4 refit over the regenerated N01-N06 (DERIVATIONS 9): the LEVEL
  # regression bed~steam gives 2.43, R2 0.82 -- used here. The SLOPE regression
  # is window-length dependent (5min 1.4, 10min 2.0, 40min 2.9, 55min 3.2)
  # because the bed lags steam by tau 139 s; that dilution, NOT measurement
  # noise (the errors-in-variables factor from emit noise is 0.9999), is why a
  # short-window OLS slope reads low. No single coef is correct for every
  # window; the slope-check thresholds below are set from the measured no-fault
  # distribution AT this coef, so their FP rate is calibrated regardless.
  # This is the LOAD_COEF stamped into every ground_truth.json
  # (state_timeline_load_coef) so a future refit is a visible relabel.
  load_coef_degc_per_tph: 2.43

  limits:
    bed_temp_avg:
      alarm_hi:    {op: ">", value: 880.0, severity: ALARM}
      critical_hi: {op: ">", value: 940.0, severity: CRITICAL}
    drum_level:
      alarm_lo:    {op: "<", value: 20.0, severity: ALARM}
      critical_lo: {op: "<", value: 10.0, severity: CRITICAL}
    ms_temperature:
      alarm_hi:    {op: ">", value: 550.0, severity: ALARM}
    drum_pressure:
      alarm_hi:    {op: ">", value: 70.0, severity: ALARM}
      alarm_lo:    {op: "<", value: 55.0, severity: ALARM}

  rates:
    # drum_level: no-fault 3-min slope p99.7 = 0.13 %/min -> 0.5 unchanged.
    # bed_temp_avg: NOT load-normalised, so the OU load swings it; no-fault
    #   10-min slope p99.7 = 1.28 degC/min (was calibrated against 20x-larger
    #   emit noise at 0.4). drum_pressure: no-fault 5-min slope p99.7 = 0.12.
    drum_level:    {threshold: 0.5,  sustained_min: 3.0,  direction: abs, unit: "%/min",       severity: WATCH}
    bed_temp_avg:  {threshold: 1.6,  sustained_min: 10.0, direction: up,  unit: "degC/min",    severity: WATCH}
    drum_pressure: {threshold: -0.15, sustained_min: 5.0, direction: down, unit: "kg/cm2/min", severity: WATCH}

  # Long-horizon drift. The ONLY thing that catches family E.
  # STAGE-4 FINDING (reports/stage4_regeneration.md): the no-fault
  # load-normalised bed slope over 55 min has p99.7 ~ 0.28 degC/min, which is
  # ~1700x the pure emit-noise OLS-slope SE (1.4e-4) -- i.e. the spread is real
  # low-frequency bed wander from the OU drivers, not measurement noise, and a
  # longer window does not shrink correlated drift. Family E's own 55-min slope
  # is ~0.19-0.24 degC/min, BELOW this threshold: family E is masked by the
  # plant's own wander and is NOT reliably slope-detectable. Threshold set at
  # the no-fault p99.7 (not into the distribution). The fix is a cumulative-
  # offset drift detector (sensitivity grows with elapsed time), an L1-stage
  # change -- advisor question, see the report.
  rates_long:
    bed_temp_avg:   {threshold: 0.28,  sustained_min: 55.0, direction: up,   unit: "degC/min", severity: WATCH}
    ms_temperature: {threshold: 0.20,  sustained_min: 40.0, direction: up,   unit: "degC/min", severity: INFO}
    drum_pressure:  {threshold: -0.01, sustained_min: 40.0, direction: down, unit: "kg/cm2/min", severity: INFO}

  # Signature magnitude bands, per tag: [deadband, slow/med, med/fast], in tag
  # units per minute, applied to the raw 10-min least-squares slope the
  # signature is built from (orchestrator._slopes -> direction_and_band).
  #     |slope| < deadband -> FLAT
  #     deadband .. slow/med -> SLOW ; slow/med .. med/fast -> MED ; >= -> FAST
  #
  # STAGE 6: moved here from a hard-coded dict in l1_symbolize.py (it was
  # MISSED by the Stage-4 threshold retune and could rot as a duplicated
  # constant). The l1_symbolize.BAND_EDGES mirror is now the device-only
  # fallback and test_checks.py asserts it equals this block.
  #
  # VALUES: reverted to the Stage-5 set. A criterion-based re-derivation was
  # attempted (deadband from "no-fault >=85% FLAT AND every fault family's
  # headline tag still moving", bed banded on the load-normalised slope). It is
  # better on every intrinsic measure -- no-fault FLAT fraction 0.85-0.998 vs
  # 0.065-0.34, ~1 vs ~8 spurious movement triples per healthy episode, D01 bed
  # clearance 0% -> 69%, RCA-01 to rank 1 for all four FCV episodes -- but mock
  # Q2_top1 fell 0.334 -> 0.173 (the mock backend's per-tick top-1 needs the
  # denser noisy signature; a lone truthful triple loses the k=4 re-rank to an
  # all-FLAT case). Q2_top1 is the acceptance bar, so the values revert pending
  # a metric that is not a mock per-tick count. Full analysis + the four
  # deciding numbers: reports/stage6_band_edges.md.
  bands:
    drum_level:      [0.03,  0.15, 0.50]   # %/min
    feed_water_flow: [0.05,  0.30, 1.00]   # TPH/min
    steam_flow:      [0.05,  0.30, 1.00]   # TPH/min
    drum_pressure:   [0.004, 0.02, 0.08]   # kg/cm2/min
    bed_temp_avg:    [0.03,  0.15, 0.50]   # degC/min  (raw slope)
    ms_temperature:  [0.04,  0.20, 0.80]   # degC/min

  balance:
    # level_gain: was 0.22 (an invented literal, DERIVATIONS 3.1); now matches
    #   the simulator's geometry.K_level(66 kg/cm2(g)) so the L1 water balance
    #   inverts exactly the relation the sim integrates.
    # residual_tph: no-fault 5-min residual p99.7 = 0.13 t/h; family B leak
    #   residual is ~2-3 t/h, so 1.5 separates them with margin.
    # p_falling: no-fault 5-min pressure slope p99.7 = 0.12 kg/cm2/min.
    # bed_rising: no-fault 5-min load-normalised bed slope p99.7 = 1.21 (at
    #   coef 2.43; the 5-min window under-corrects, beta_5min ~ 1.4).
    level_gain_pct_per_min_per_tph: 0.586
    residual_tph: 1.5
    window_min: 5.0
    p_falling: 0.15
    bed_rising: 1.3
    steam_flat_tph_per_min: 0.3

  validity:
    stuck_minutes: 10.0
    stuck_mad_eps: 0.001
    physical_range:
      drum_level:      [0.0, 100.0]
      feed_water_flow: [0.0, 120.0]
      steam_flow:      [0.0, 120.0]
      drum_pressure:   [0.0, 90.0]
      bed_temp_avg:    [0.0, 1200.0]
      ms_temperature:  [0.0, 700.0]
    max_step:
      drum_level: 5.0
      feed_water_flow: 15.0
      steam_flow: 15.0
      drum_pressure: 3.0
      bed_temp_avg: 25.0
      ms_temperature: 25.0

# ---------------------------------------------------------------------------
paths:
  asset_model: data/kb/asset_model.json
  case_library: data/kb/case_library.json
  action_catalogue: data/kb/action_catalogue.json
  episodes: data/episodes
  experience: data/experience/store.json
  results: results